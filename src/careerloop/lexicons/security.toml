[extraction]
# "SOC" names the team in most postings, not a skill; the rest are company, industry or
# benefit words that postings capitalise (seen on live SOC postings, 2026-10-16)
acronym_noise = ["soc", "ai", "ip", "msp", "mssp", "betterup", "soc-relevant"]
