[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kenloop"
version = "0.1.0"
description = "Learn what you want to understand, with an honest record of what you know: spaced review, graded dialogue, question ladders, and a job-search sidecar that lets onto your resume only what you have proved."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["learning", "spaced-repetition", "fsrs", "socratic-dialogue", "study-plan", "job-search", "resume"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Development Status :: 4 - Beta",
    "Topic :: Education",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/sethpsonnier/kenloop"
Documentation = "https://github.com/sethpsonnier/kenloop/tree/main/docs"
Issues = "https://github.com/sethpsonnier/kenloop/issues"

[project.scripts]
kenloop = "kenloop.cli:main"
ken = "kenloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kenloop.career" = ["lexicons/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
