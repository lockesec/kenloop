# GitHub-hosted runners only. Never attach a self-hosted runner to a public
# repository: any pull request author could run code on that machine.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests from source
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pytest -q
      - name: Scheduler parity against py-fsrs (the oracle must run, not skip)
        if: matrix.python != '3.9'
        env:
          KENLOOP_REQUIRE_ORACLE: "1"
        run: python -m pytest -q tests/test_fsrs_oracle.py
      - name: Clean install, then the demo from outside the source tree
        run: |
          python -m venv /tmp/clean
          # hash-pinned deps and build backend first; then the package itself with
          # no dependency resolution and no build-isolation download
          /tmp/clean/bin/pip install --require-hashes -r requirements-ci.txt
          /tmp/clean/bin/pip install --no-deps --no-build-isolation .
          cd /tmp
          PATH=/tmp/clean/bin:$PATH sh "$GITHUB_WORKSPACE"/examples/demo.sh > /tmp/demo.out
          sh "$GITHUB_WORKSPACE"/examples/check_readme.sh /tmp/demo.out
